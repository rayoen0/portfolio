<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Drive</title>
<meta name="description" content="Drive: a multiple-choice knowledge test you read like a car's instrument cluster.">
<link rel="icon" href="drive-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="copy.js"></script>
<script src="copy-drive.js"></script>
<script>(function(){var r=document.documentElement;r.classList.add('js');try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)r.classList.add('rm');}catch(e){}})();</script>
<style>
/* Drive's own tokens (drive-assessment line/ + shared/feedback.css): white first, near-black ink, one red #E10600 for the
   thread, the needle and the one primary action; green only for a right answer. Instrument Sans for words, Barlow Condensed
   for readings, IBM Plex Mono for labels. Square corners (radius 2), red stitching as the motif. */
:root{
  color-scheme:light dark;
  --g:#FFFFFF;--card:#F3F2EF;--card2:#FAFAF8;--i:#0C0C0C;--i2:#555555;--i3:#767676;--line:#E6E6E6;--line2:#CFCFCF;
  --red:#E10600;--red-ink:#B80500;--red-t:#FBEAEA;--grn:#15803D;--grn-t:#EAF4EC;--on-red:#FFFFFF;
  --sans:"Instrument Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --out:cubic-bezier(.2,.7,.2,1);--gut:32px;
}
@media (prefers-color-scheme:dark){:root{
  --g:#0C0C0C;--card:#161514;--card2:#121211;--i:#EEECE7;--i2:#B0ACA5;--i3:#8E8A84;--line:#2A2A2A;--line2:#3A3A3A;
  --red:#FF3B2F;--red-ink:#FF6A60;--red-t:#2A1311;--grn:#4CC37A;--grn-t:#10241A;--on-red:#0C0C0C;
}}
@media (max-width:759px){:root{--gut:16px}}
*{box-sizing:border-box}
html{background:var(--g);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--g);color:var(--i);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
h1,h2{text-wrap:balance}
body{font-variant-numeric:tabular-nums}
ul,ol{list-style:none}
b{font-weight:600}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:calc(1200px + 2 * var(--gut));margin:0 auto;padding:0 var(--gut)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--i2)}

/* controls: square-ish, radius 2, heights 32 / 44 / 52; red only for the one primary */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:var(--i);font:500 15px/1 var(--sans);text-decoration:none;cursor:pointer;white-space:nowrap;transition:border-color .16s,background-color .16s,color .16s,transform .12s ease-out}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--i)}}
.btn:active{transform:scale(.97)}
.btn.small{min-height:32px;padding:0 12px;font-size:13px}
.btn.ink{position:relative;background:var(--i);border-color:var(--i);color:var(--g);font-weight:600;min-height:52px;padding:0 26px}
.btn.ink::after{content:"";position:absolute;inset:5px;border:1.5px dashed color-mix(in srgb,var(--g) 55%,transparent);border-radius:1px;pointer-events:none}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red);font-weight:600;min-width:150px}
.btn.red:disabled{opacity:.35;cursor:default;transform:none}
.arr{width:18px;height:10px;flex:none}

/* top bar + the red seam under it (the product's header stitching) */
.top{position:relative;z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:72px}
.top nav{margin-left:auto;display:flex;gap:2px}
.top nav a{color:var(--i2);font-size:13px;min-height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:2px;text-decoration:none;transition:color .12s,background-color .12s}
@media (hover:hover) and (pointer:fine){.top nav a:hover{color:var(--i);background:var(--card)}}
@media (max-width:899px){.top nav{display:none}}
.seam{display:block;width:100%;height:4px}
.seam line{stroke:var(--red);stroke-width:2;stroke-dasharray:7 5}
.js:not(.rm) .seam line{stroke-dashoffset:1600;animation:sew 1.6s cubic-bezier(.22,.61,.36,1) .1s forwards}
@keyframes sew{to{stroke-dashoffset:0}}

/* ---- hero ---- */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.lock{display:flex;align-items:center;gap:12px;font:600 20px/1 var(--sans);letter-spacing:-.01em}
.lock svg{width:30px;height:30px;flex:none}
.hero h1{margin-top:28px;font:600 clamp(36px,4.4vw,60px)/1.02 var(--sans);letter-spacing:-.035em;max-width:13ch}
.hero .who,.hero .how{margin-top:18px;font-size:18px;line-height:1.45;color:var(--i2);max-width:34ch}
.hero .how{margin-top:10px;color:var(--i)}
.facts{display:flex;gap:28px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.facts li{font:600 26px/1 var(--cond);letter-spacing:.01em}
.hero-act{margin-top:32px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{position:relative;max-width:640px;width:100%;margin-left:auto}
.dial svg{display:block;width:100%;height:auto;overflow:visible}
.dkey{display:flex;gap:24px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.dkey span{display:inline-flex;align-items:center;gap:8px;font:400 13px/1.2 var(--cond);letter-spacing:.06em;color:var(--i2)}
.dkey i{display:inline-block;width:20px;height:4px;background:var(--i2)}
.dkey i.t{height:10px;width:14px;background:repeating-linear-gradient(90deg,var(--i2) 0 2px,transparent 2px 6px)}
@media (max-width:899px){.hero{padding-top:28px}.hero .wrap{grid-template-columns:1fr;gap:28px}.dial{margin:0 auto;max-width:480px}}

/* gauge pieces */
.g-track{fill:none;stroke:var(--line);stroke-width:16}
.g-val{fill:none;stroke:var(--red);stroke-width:16}
.g-tick{stroke-width:2.4;stroke-linecap:butt}
.g-tl{font:500 13px/1 var(--cond);letter-spacing:.08em;fill:var(--i2);text-transform:uppercase}
.g-num{font:600 58px/1 var(--cond);fill:var(--i);letter-spacing:-.01em}
.g-unit{font-size:26px}
.g-lab{font:500 10px/1 var(--mono);letter-spacing:.14em;fill:var(--i2);text-transform:uppercase}
.needle-breathe{transform-box:view-box}
.js:not(.rm) .idle .needle-breathe{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}

/* ---- scenes ---- */
.scene{padding:112px 0 0}
.scene-head{max-width:820px}
.scene h2{font:600 clamp(26px,2.6vw,36px)/1.15 var(--sans);letter-spacing:-.025em}
.scene .lede{margin-top:14px;font-size:17px;line-height:1.5;color:var(--i2);max-width:62ch}
.stage{margin-top:44px}
@media (max-width:759px){.scene{padding-top:80px}.stage{margin-top:28px}}

/* stitched card (briefing, certificate) */
.stitched{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:40px 44px}
.stitched::before{content:"";position:absolute;inset:10px;border:1.6px dashed var(--red);border-radius:3px;pointer-events:none}
@media (max-width:759px){.stitched{padding:28px 22px}}

/* briefing */
.brief{max-width:800px}
.brief .head{font:600 clamp(28px,3vw,40px)/1.1 var(--sans);letter-spacing:-.03em;margin-top:10px}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:28px;border-top:1px solid var(--i3)}
.cell{padding:16px 18px 18px;border-bottom:1px solid var(--line2);position:relative}
.cell+.cell{border-left:1px solid var(--line2)}
.cell:nth-child(4){border-left:0}
.cell:nth-child(3)::before{content:"";position:absolute;left:0;right:0;top:-2px;height:3px;background:var(--red)}
.cell .mono{font-size:10.5px}
.cell .mono b{font-weight:400;color:var(--i3);margin-right:10px}
.cell .v{display:block;margin-top:10px;font:600 46px/1 var(--cond);letter-spacing:-.005em}
.cell .v small{font-size:22px;font-weight:500;color:var(--i2);margin-left:4px}
.cell .v.w{font-size:30px;line-height:1.15;margin-top:14px}
.btopics{margin-top:26px}
.btopics ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:10px}
.btopics li{display:flex;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2)}
.btopics li .mono{letter-spacing:.06em}
.btopics li span:nth-child(2){flex:1}
.btopics li .cnt{font:400 13px/1 var(--mono);color:var(--i2)}
.brief-act{display:flex;align-items:center;justify-content:space-between;margin-top:32px;gap:16px}
.linkish{font:500 15px/1 var(--sans);border-bottom:1.5px solid currentColor;padding-bottom:3px}
@media (max-width:759px){.cells{grid-template-columns:repeat(2,minmax(0,1fr))}.cell:nth-child(3){border-left:0}.cell:nth-child(4){border-left:1px solid var(--line2)}.cell:nth-child(5){border-left:0}.cell .v{font-size:38px}.cell .v.w{font-size:24px}.btopics ol{grid-template-columns:1fr}}

/* answering: the question page, live */
.qpage{max-width:880px;border:1px solid var(--line);border-radius:4px;background:var(--g);overflow:hidden}
.qbar{display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}
.qbar .qt{font-size:14px;color:var(--i2)}
.batt{margin-left:auto;display:flex;align-items:center;gap:10px;font:400 12px/1 var(--mono);color:var(--i2)}
.batt .cell-b{position:relative;width:118px;height:20px;border:1.5px solid var(--i);border-radius:2px;padding:2px}
.batt .cell-b::after{content:"";position:absolute;right:-5px;top:5px;width:3px;height:7px;background:var(--i)}
.batt .cell-b i{display:block;height:100%;background:var(--red);border-radius:1px;transition:width .5s var(--out)}
.qbody{padding:28px 48px 36px}
.qsub{display:flex;align-items:center;gap:10px}
.qsub svg{width:16px;height:16px;flex:none;color:var(--i2)}
.qtext{margin-top:12px;font:500 clamp(21px,2.1vw,28px)/1.25 var(--sans);letter-spacing:-.02em;max-width:34ch}
.opts{margin-top:22px;display:grid;gap:10px}
.opt{appearance:none;position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:54px;padding:8px 16px;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:2px;color:var(--i);font:400 16px/1.35 var(--sans);cursor:pointer;transition:border-color .16s,background-color .2s,opacity .2s}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--i3)}}
.opt .k{flex:none;width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:400 12px/1 var(--mono);color:var(--i2);background:var(--g);transition:background-color .2s,border-color .2s,color .2s}
.opt .k svg{width:14px;height:14px}
.opt.sel{border-color:var(--i)}
.opt.sel .k{border-color:var(--i);background:var(--i);color:var(--g)}
.opt.ok,.opt.no{opacity:1}
.opt.ok{background:var(--grn-t);border-color:var(--grn)}
.opt.ok .k{background:var(--grn);border-color:var(--grn);color:#fff}
.opt.no{background:var(--red-t);border-color:var(--red)}
.opt.no .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.ok::after,.opt.no::after{content:"";position:absolute;inset:4px;border:1.5px dashed var(--grn);border-radius:1px;pointer-events:none}
.opt.no::after{border-color:var(--red)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.verdict{margin-top:18px;padding:18px 22px;background:var(--red-t);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:2px}
.verdict.good{background:var(--grn-t);border-color:color-mix(in srgb,var(--grn) 35%,transparent)}
.verdict .vh{display:flex;align-items:center;gap:12px;font:600 19px/1.2 var(--sans)}
.verdict .vh i{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;flex:none}
.verdict.good .vh i{background:var(--grn)}
.verdict .vh svg{width:13px;height:13px}
.verdict .mono{display:block;margin-top:12px}
.verdict p{margin-top:6px;font-size:15.5px;line-height:1.5;max-width:66ch}
.js:not(.rm) .verdict{animation:rise .32s var(--out)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.qfoot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:759px){.qbody{padding:20px 18px 24px}.qbar{padding:12px 18px}.batt .cell-b{width:84px}.qbar .qt{flex-basis:100%}.batt{margin-left:0}}

/* topics: bars against the 80 % line */
.who-switch{display:inline-flex;border:1px solid var(--line2);border-radius:2px;padding:3px;gap:3px}
.who-switch button{appearance:none;border:0;background:transparent;color:var(--i2);font:500 14px/1 var(--sans);min-height:38px;padding:0 16px;border-radius:1px;cursor:pointer;transition:background-color .2s,color .2s}
.who-switch button[aria-pressed="true"]{background:var(--i);color:var(--g)}
.tboard{margin-top:24px;max-width:1040px}
.overall{display:grid;grid-template-columns:200px minmax(0,1fr) 190px;gap:24px;align-items:center;padding:20px 0;border-top:2px solid var(--i);border-bottom:1px solid var(--line)}
.overall .num{font:600 52px/1 var(--cond)}
.overall .num small{font-size:20px;color:var(--i2);font-weight:500;margin-left:4px}
.vtag{display:inline-flex;align-items:center;gap:10px;font:600 20px/1.1 var(--sans);letter-spacing:-.01em}
.vtag svg{width:18px;height:14px;flex:none}
.vtag.almost{color:var(--red-ink)}
.bar{position:relative;height:10px;background:var(--line);border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--i);border-radius:1px;transition:width .7s cubic-bezier(.22,.61,.36,1),background-color .3s}
.bar i.low{background:var(--red)}
.bar .m80{position:absolute;left:80%;top:-10px;bottom:-10px;width:0;border-left:1.5px solid var(--i)}
.trow{border-bottom:1px solid var(--line)}
.tbtn{appearance:none;display:grid;grid-template-columns:200px minmax(0,1fr) 190px;gap:24px;align-items:center;width:100%;padding:18px 0;background:transparent;border:0;color:var(--i);text-align:left;cursor:pointer;font:inherit}
.tname{display:flex;align-items:baseline;gap:12px;font:500 18px/1.2 var(--sans)}
.tname .mono{letter-spacing:.06em;font-size:11px}
.tscore{display:flex;align-items:center;gap:12px;font:500 18px/1 var(--cond);letter-spacing:.02em}
.tscore .pct{font:400 12px/1 var(--mono);color:var(--i2);letter-spacing:.04em}
.tscore .flag{width:18px;height:14px;flex:none}
.tscore .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin:0 5px;flex:none}
.tscore .chev{margin-left:auto;width:14px;height:14px;color:var(--i2);transition:transform .25s var(--out)}
.tbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tsubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 0 18px 224px}
.tsub{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font-size:14.5px}
.tsub b{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--i);color:var(--g)}
.tsub.x b{background:var(--red);color:#fff}
.tsub svg{width:10px;height:10px}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 48px;margin-top:28px}
.lists ul{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lists li{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line2);border-radius:2px;font-size:14px}
.lists li svg{width:14px;height:11px}
.lists li .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.lists .none{font-size:14px;color:var(--i3)}
@media (max-width:759px){.overall,.tbtn{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}.overall .bar,.tbtn .bar{grid-column:1/-1;grid-row:2}.tsubs{grid-template-columns:1fr;padding-left:0}.lists{grid-template-columns:1fr}.overall .num{font-size:42px}}

/* certificate flip */
.certrow{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:56px;align-items:center}
.flip{appearance:none;display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer;perspective:1200px;color:inherit;font:inherit}
.card3d{position:relative;aspect-ratio:6/5;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.card3d.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
.face svg{display:block;width:100%;height:100%}
.face.back{transform:rotateY(180deg)}
.c-kick{font:500 10px/1 var(--mono);letter-spacing:.18em;fill:var(--i2)}
.c-test{font:600 27px/1 var(--cond);letter-spacing:.01em;fill:var(--i)}
.c-pass{font:700 62px/1 var(--cond);letter-spacing:.01em;fill:var(--i)}
.c-meta{font:400 10px/1 var(--mono);letter-spacing:.16em;fill:var(--i2)}
.c-sew{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:6 5}
.vbig{display:flex;align-items:center;gap:18px;font:500 clamp(44px,4.6vw,64px)/1 var(--sans);letter-spacing:-.035em}
.vbig svg{width:34px;height:28px;flex:none}
.stats{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
.stats .mono{font-size:10.5px}
.stats b{display:block;margin-top:8px;font:600 34px/1 var(--cond)}
.stats b small{font-size:17px;font-weight:500;color:var(--i2);margin:0 4px}
.cert-act{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
@media (max-width:899px){.certrow{grid-template-columns:1fr;gap:32px}}

/* sheet */
.book{max-width:1080px;border:1px solid var(--line);border-radius:4px;background:var(--g);overflow:hidden}
.book-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font:400 13px/1 var(--mono);color:var(--i2)}
.book-top svg{width:18px;height:18px;flex:none;color:var(--grn)}
.grid-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;white-space:nowrap}
th{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--i2);background:var(--card2);text-transform:uppercase}
td.wrap-c{white-space:normal;min-width:260px}
td.ans{font-family:var(--mono);color:var(--red-ink);font-weight:500}
.rownum{width:36px;text-align:right;color:var(--i3);font:400 11px/1.4 var(--mono);background:var(--card2)}
.tabs{display:flex;gap:0;border-top:1px solid var(--line);background:var(--card2)}
.tabs button{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--i2);font:500 13px/1 var(--sans);min-height:40px;padding:0 18px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--g);color:var(--i)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--grn)}

/* phone: labels stay legible */
@media (max-width:759px){.mono,.cell .mono,.stats .mono,.tname .mono,.verdict .mono,th,.rownum,.batt,.book-top{font-size:12px}.g-lab{font-size:13px}.c-kick,.c-meta{font-size:12px}.cell .mono b{margin-right:6px}}

/* foot */
footer{margin-top:128px;border-top:1px solid var(--line)}
.foot{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-top:24px;padding-bottom:48px;color:var(--i3);font-size:13px}

<body>
<header class="top">
  <div class="wrap">

    <nav aria-label="Sections"><a href="#briefing" data-copy="drive.nav.briefing">Briefing</a><a href="#answering" data-copy="drive.nav.answering">Answering</a><a href="#topics" data-copy="drive.nav.topics">Topics</a><a href="#certificate" data-copy="drive.nav.certificate">Certificate</a><a href="#sheet" data-copy="drive.nav.sheet">Your test</a></nav>

</header>

<main>
<section class="hero" id="top">
  <div class="wrap">
    <div class="hcopy">
      <p class="lock"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0C0C0C"/><path d="M11 10h15l-5 12H6z" fill="#E10600"/></svg><span data-copy="drive.hero.name">Drive</span></p>
      <h1 data-copy="drive.hero.what">A knowledge test you read like an instrument cluster.</h1>
      <p class="who" data-copy="drive.hero.who"></p>
      <p class="how" data-copy="drive.hero.how"></p>
      <ul class="facts"><li data-copy="drive.hero.facts.0"></li><li data-copy="drive.hero.facts.1"></li><li data-copy="drive.hero.facts.2"></li></ul>
      <div class="hero-act">
        <a class="btn ink" href="https://rayoen0.github.io/drive-assessment/" target="_blank" rel="noopener"><span data-copy="drive.hero.open">Open Drive</span><svg class="arr" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 5h16M12 1l4 4-4 4"/></svg></a>
      </div>
    </div>
    <div class="dial" role="img" data-copy-aria="drive.hero.gaugeLabel">
      <svg id="heroGauge" viewBox="0 0 400 330"></svg>
      <div class="dkey" aria-hidden="true"><span><i></i><b data-copy="drive.gauge.key.0" style="font-weight:400"></b></span><span><i class="t"></i><b data-copy="drive.gauge.key.1" style="font-weight:400"></b></span></div>
    </div>
  </div>
</section>

<section class="scene" id="briefing">
  <div class="wrap">
    <div class="scene-head"><h2 data-copy="drive.briefing.title"></h2><p class="lede" data-copy="drive.briefing.lede"></p></div>
    <div class="stage">
      <div class="stitched brief">
        <p class="mono" data-copy="drive.briefing.kicker"></p>
        <p class="head" data-copy="drive.briefing.head"></p>
        <div class="cells" id="cells"></div>
        <div class="btopics"><p class="mono"><span data-copy="drive.briefing.topicsLabel"></span>&nbsp;&nbsp;3</p><ol id="btopics"></ol></div>
        <div class="brief-act"><a class="btn ink" href="#answering"><span data-copy="drive.briefing.begin"></span><svg class="arr" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 5h16M12 1l4 4-4 4"/></svg></a><a class="linkish" href="#top" data-copy="drive.briefing.backBtn"></a></div>
      </div>

  </div>
</section>

<section class="scene" id="answering">
  <div class="wrap">
    <div class="scene-head"><h2 data-copy="drive.answering.title"></h2><p class="lede" data-copy="drive.answering.lede"></p></div>
    <div class="stage">
      <div class="qpage">
        <div class="qbar"><span class="qt" data-copy="drive.answering.quiz"></span><span class="batt"><span class="cell-b"><i id="battFill" style="width:20%"></i></span><span id="qCount">5 / 25</span><span id="qTime">06:12</span></span></div>
        <svg class="seam" viewBox="0 0 1600 4" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="2" x2="1600" y2="2" style="animation:none;stroke-dashoffset:0"/></svg>

    <div class="stage">
      <div class="who-switch" role="group" data-copy-aria="drive.topicsScene.switchLabel" id="whoSwitch"></div>

<section class="scene" id="certificate">

    <div class="stage certrow">
      <button class="flip" type="button" id="flip" data-copy-aria="drive.cert.flipLabel">
        <div class="card3d" id="card3d">
          <div class="face front"><svg id="certGauge" viewBox="0 0 400 330" aria-hidden="true"></svg></div>
          <div class="face back"><svg id="certFace" viewBox="0 0 360 300" aria-hidden="true"></svg></div>
        </div>

      <div>
        <p class="vbig"><svg viewBox="0 0 34 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M3 14l10 10L31 4"/></svg><span data-copy="drive.cert.verdict"></span></p>
        <div class="stats" id="stats"></div>
        <div class="cert-act"><a class="btn red" href="#briefing"><span data-copy="drive.cert.again"></span><svg class="arr" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 5h16M12 1l4 4-4 4"/></svg></a><a class="btn" href="#top" data-copy="drive.cert.home"></a></div>

</section>

<section class="scene" id="sheet">

    <div class="stage">
      <div class="book">
        <div class="book-top"><svg viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="16" height="16" rx="2" fill="currentColor"/><path d="M5.5 5l7 8M12.5 5l-7 8" stroke="#fff" stroke-width="1.8"/></svg><span data-copy="drive.sheet.file"></span></div>

    <p data-copy="drive.invented"></p>
    <p data-copy="drive.footer">Designed and built by Rayane El Metni.</p>
  </div>
</footer>

<script>
(function(){
"use strict";
var root = document.documentElement;
var COPY = window.COPY || {}, C = COPY.drive || {};
var RM = root.classList.contains("rm");
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return [].slice.call((r || document).querySelectorAll(s)); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
var r1 = function(n){ return Math.round(n * 10) / 10; };

/* ---------- copy: every word comes from copy-drive.js ---------- */
function cget(p){ return p.split(".").reduce(function(o, k){ return o == null ? o : o[k]; }, COPY); }
$$("[data-copy]").forEach(function(el){ var v = cget(el.dataset.copy); if (typeof v === "string") el.textContent = v; });
$$("[data-copy-aria]").forEach(function(el){ var v = cget(el.dataset.copyAria); if (typeof v === "string") el.setAttribute("aria-label", v); });
if (C.title) { document.title = C.title; var md = $("meta[name=description]"); if (md) md.setAttribute("content", C.description); }

/* ---------- invented results: 25 questions, three topics (10 / 8 / 7) ---------- */
var COUNTS = [10, 8, 7];
var PEOPLE = [
  { right: [8, 7, 6], subs: [[1, 0, 1], [1, 1, 1], [1, 1, 1]] },   /* A: 84 %, every topic at or past 80: passes */
  { right: [10, 5, 6], subs: [[1, 1, 1], [1, 0, 0], [1, 1, 1]] }   /* B: 84 %, Cloud 63 %: almost there */
];
function pct(p, t){ return Math.round(PEOPLE[p].right[t] / COUNTS[t] * 100); }
function overall(p){ var a = PEOPLE[p].right.reduce(function(s, n){ return s + n; }, 0); return { n: a, pct: Math.round(a / 25 * 100) }; }
function passes(p){ return PEOPLE[p].right.every(function(n, t){ return n / COUNTS[t] >= .8; }); }

var FLAG = '<svg class="flag" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 1v12" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><rect x="2" y="1" width="4" height="3"/><rect x="10" y="1" width="4" height="3"/><rect x="6" y="4" width="4" height="3"/><rect x="14" y="4" width="3" height="3"/><rect x="2" y="7" width="4" height="3"/><rect x="10" y="7" width="4" height="3"/></g><path d="M2 1h15v9H2" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
var TICK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>';
var CROSS = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>';

/* ---------- the speedometer (Drive's overall dial: inner arc = overall score, outer ticks = one per question, grouped by topic) ---------- */
var GX = 200, GY = 190, R = 110, A0 = -120, SPAN = 240, PASS = .8;
function pol(a, r){ var t = a * Math.PI / 180; return [GX + Math.sin(t) * r, GY - Math.cos(t) * r]; }
function arc(a1, a2, r){ var p = pol(a1, r), q = pol(a2, r); return "M" + r1(p[0]) + " " + r1(p[1]) + "A" + r + " " + r + " 0 " + (a2 - a1 > 180 ? 1 : 0) + " 1 " + r1(q[0]) + " " + r1(q[1]); }
function gauge(svg, p, idp){
  var o = overall(p), score = o.pct / 100, len = Math.PI * R * SPAN / 180;
  var h = '<defs><pattern id="' + idp + 'chq" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--g)"/><rect width="3" height="3" fill="var(--i)"/><rect x="3" y="3" width="3" height="3" fill="var(--i)"/></pattern></defs>';
  h += '<path class="g-track" d="' + arc(A0, A0 + SPAN, R) + '"/>';
  h += '<path class="g-val" data-len="' + r1(len) + '" d="' + arc(A0, A0 + SPAN * score, R) + '" stroke-dasharray="' + r1(len) + '" stroke-dashoffset="0"/>';
  var gap = 7, per = (SPAN - gap * 2) / 25, a = A0, k = 0;
  COUNTS.forEach(function(n, t){
    var ok = PEOPLE[p].right[t] / n >= .8, start = a;
    for (var i = 0; i < n; i++) {
      var aa = a + per * (i + .5), miss = [1, 4, 6, 2, 5, 3].slice(0, n - PEOPLE[p].right[t]).indexOf(i) >= 0;
      var p1 = pol(aa, R + 17), p2 = pol(aa, R + 29);
      h += '<line class="g-tick" data-k="' + (k++) + '" x1="' + r1(p1[0]) + '" y1="' + r1(p1[1]) + '" x2="' + r1(p2[0]) + '" y2="' + r1(p2[1]) + '" stroke="' + (ok ? "var(--i)" : "var(--red)") + '" opacity="' + (miss ? .22 : 1) + '"/>';
    }
    a += per * n;
    var mid = pol((start + a) / 2, R + 42), anc = mid[0] > GX + 30 ? "start" : mid[0] < GX - 30 ? "end" : "middle";
    h += '<text class="g-tl" x="' + r1(mid[0]) + '" y="' + r1(mid[1] + 4) + '" text-anchor="' + anc + '">' + esc(C.topics[t]) + '</text>';
    a += gap;
  });
  var m1 = pol(A0 + SPAN * PASS, R - 10), m2 = pol(A0 + SPAN * PASS, R + 10);
  h += '<line x1="' + r1(m1[0]) + '" y1="' + r1(m1[1]) + '" x2="' + r1(m2[0]) + '" y2="' + r1(m2[1]) + '" stroke="url(#' + idp + 'chq)" stroke-width="8"/>';
  h += '<g class="needle-breathe" style="transform-origin:' + GX + 'px ' + GY + 'px"><g class="needle" style="transform-origin:' + GX + 'px ' + GY + 'px;transform:rotate(' + (A0 + SPAN * score) + 'deg)"><path d="M' + (GX - 2.6) + ' ' + (GY + 12) + 'L' + GX + ' ' + (GY - R + 20) + 'L' + (GX + 2.6) + ' ' + (GY + 12) + 'Z" fill="var(--red)"/></g></g><circle cx="' + GX + '" cy="' + GY + '" r="8" fill="var(--i)"/>';
  h += '<text class="g-num" x="' + GX + '" y="' + (GY + 74) + '" text-anchor="middle"><tspan class="gnum">' + o.pct + '</tspan><tspan class="g-unit" dx="3">%</tspan></text>';
  h += '<text class="g-lab" x="' + GX + '" y="' + (GY + 98) + '" text-anchor="middle">' + esc(C.gauge.overall) + '</text>';
  h += '<text class="g-lab" x="' + GX + '" y="' + (GY + 118) + '" text-anchor="middle" fill="var(--i3)">' + esc(C.gauge.passMark) + '</text>';
  svg.innerHTML = h;
  return { val: $(".g-val", svg), needle: $(".needle", svg), ticks: $$(".g-tick", svg), num: $(".gnum", svg), score: score, len: len, wrap: svg };
}

/* hero: the self-test sweep (full range, then settles on the score), ticks light in order, then the needle breathes */
var HG = gauge($("#heroGauge"), 0, "h");
function heroRun(){
  var end = A0 + SPAN * HG.score;
  if (RM) { HG.wrap.classList.add("idle"); return; }
  HG.val.style.strokeDashoffset = HG.len;
  HG.ticks.forEach(function(t){ t.dataset.o = t.getAttribute("opacity"); t.setAttribute("opacity", 0); });
  HG.needle.style.transform = "rotate(" + A0 + "deg)";
  HG.num.textContent = "0";
  void HG.wrap.getBoundingClientRect();
  setTimeout(function(){
    HG.val.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1) .35s"; HG.val.style.strokeDashoffset = 0;
    HG.needle.animate([{ transform: "rotate(" + A0 + "deg)" }, { transform: "rotate(" + (A0 + SPAN) + "deg)", offset: .42 }, { transform: "rotate(" + end + "deg)" }], { duration: 1500, easing: "cubic-bezier(.45,.05,.3,1)", fill: "forwards" });
    HG.ticks.forEach(function(t, i){ setTimeout(function(){ t.setAttribute("opacity", t.dataset.o); }, 250 + i * 34); });
    var t0 = performance.now(), target = Math.round(HG.score * 100);
    (function count(now){ var k = Math.min(1, (now - t0 - 500) / 1000); if (k > 0) HG.num.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(count); })(t0);
    setTimeout(function(){ HG.needle.style.transform = "rotate(" + end + "deg)"; HG.wrap.classList.add("idle"); }, 1600);
  }, 120);
}
heroRun();

/* ---------- briefing card ---------- */
var B = C.briefing;
$("#cells").innerHTML = B.cells.map(function(c, i){
  var word = !/^[≈≥\d]/.test(c.v);
  return '<div class="cell"><p class="mono"><b>0' + (i + 1) + '</b>' + esc(c.k) + '</p><span class="v' + (word ? " w" : "") + '">' + esc(c.v) + (c.u ? '<small>' + esc(c.u) + '</small>' : "") + '</span></div>';
}).join("");
$("#btopics").innerHTML = C.topics.map(function(t, i){ return '<li><span class="mono">0' + (i + 1) + '</span><span>' + esc(t) + '</span><span class="cnt">' + esc(B.counts[i]) + '</span></li>'; }).join("");

/* ---------- answering: three invented questions, one click to submit ---------- */
var A = C.answering, qi = 0, pick = -1, done = false, LET = ["A", "B", "C", "D"];
var ARROW = '<svg class="arr" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M0 5h16M12 1l4 4-4 4"/></svg>';
function renderQ(){
  var q = A.questions[qi]; pick = -1; done = false;
  $("#qCount").textContent = q.n + " / 25";
  $("#qTime").textContent = "0" + (q.n - 1) + ":" + (q.n * 7 % 60 < 10 ? "0" : "") + (q.n * 7 % 60);
  $("#battFill").style.width = (q.n - 1) / 25 * 100 + "%";
  $("#qbody").innerHTML = '<p class="qsub"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M1.5 2.5v5l7 7 6-6-7-7h-5z"/><circle cx="5" cy="5.5" r="1.2"/></svg><span class="mono">' + esc(q.sub) + '</span></p>' +
    '<p class="qtext" id="qText">' + esc(q.q) + '</p>' +
    '<div class="opts" role="radiogroup" aria-labelledby="qText">' + q.opts.map(function(o, k){ return '<button class="opt" type="button" role="radio" aria-checked="false" data-k="' + k + '"><span class="k">' + LET[k] + '</span><span>' + esc(o) + '</span></button>'; }).join("") + '</div>' +
    '<div id="verdict" aria-live="polite"></div>' +
    '<div class="qfoot"><button class="btn red" type="button" id="qGo" disabled><span>' + esc(A.submit) + '</span>' + ARROW + '</button></div>';
}
function submit(){
  var q = A.questions[qi], good = pick === q.correct; done = true;
  $$(".opt", $("#qbody")).forEach(function(b, k){
    b.disabled = true; b.classList.remove("sel");
    if (k === q.correct) { b.classList.add("ok"); $(".k", b).innerHTML = TICK; }
    else if (k === pick) { b.classList.add("no"); $(".k", b).innerHTML = CROSS; }
    else b.classList.add("dim");
  });
  $("#verdict").innerHTML = '<div class="verdict' + (good ? " good" : "") + '"><p class="vh"><i>' + (good ? TICK : CROSS) + '</i>' + esc(good ? A.right : A.wrong) + '</p><span class="mono">' + esc(A.why) + '</span><p>' + esc(q.why) + '</p></div>';
  $("#battFill").style.width = q.n / 25 * 100 + "%";
  var go = $("#qGo"), last = qi === A.questions.length - 1;
  $("span", go).textContent = last ? A.finish : A.next;
  go.focus({ preventScroll: true });
}
$("#qbody").addEventListener("click", function(e){
  var o = e.target.closest(".opt");
  if (o && !done) {
    pick = +o.dataset.k;
    $$(".opt", $("#qbody")).forEach(function(b){ var on = b === o; b.classList.toggle("sel", on); b.setAttribute("aria-checked", on); });
    $("#qGo").disabled = false; return;
  }
  if (e.target.closest("#qGo")) {
    if (!done) return submit();
    if (qi === A.questions.length - 1) { qi = 0; renderQ(); var t = $("#topics"); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth" }); return; }
    qi++; renderQ(); var f = $(".opt", $("#qbody")); if (f) f.focus({ preventScroll: true });
  }
});
$("#qbody").addEventListener("keydown", function(e){
  if (e.key === "Enter" && pick >= 0 && !done && e.target.closest(".opt")) { e.preventDefault(); submit(); }
});
renderQ();

/* ---------- topics: two candidates, the same 84 %, one weak topic ---------- */
var T = C.topicsScene, who = 0, openRow = -1;
$("#whoSwitch").innerHTML = T.people.map(function(n, i){ return '<button type="button" aria-pressed="' + (i === 0) + '" data-p="' + i + '">' + esc(n) + '</button>'; }).join("");
function tag(p){ return passes(p) ? '<span class="vtag">' + FLAG + esc(T.passed) + '</span>' : '<span class="vtag almost"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span>' + esc(T.almost) + '</span>'; }
function renderT(first){
  var o = overall(who), good = [], work = [];
  var h = '<div class="overall"><p class="num">' + o.pct + '<small>%</small></p><div class="bar"><i style="width:' + (first ? 0 : o.pct) + '%" data-w="' + o.pct + '"></i><span class="m80"></span></div><div>' + tag(who) + '</div></div>';
  COUNTS.forEach(function(n, t){
    var pc = pct(who, t), ok = pc >= 80;
    PEOPLE[who].subs[t].forEach(function(s, j){ (s ? good : work).push(T.subs[t][j]); });
    h += '<div class="trow"><button class="tbtn" type="button" aria-expanded="' + (openRow === t) + '" data-t="' + t + '" aria-label="' + esc(T.open + " " + C.topics[t]) + '">' +
      '<span class="tname"><span class="mono">0' + (t + 1) + '</span>' + esc(C.topics[t]) + '</span>' +
      '<span class="bar"><i class="' + (ok ? "" : "low") + '" style="width:' + (first ? 0 : pc) + '%" data-w="' + pc + '"></i><span class="m80"></span></span>' +
      '<span class="tscore">' + (ok ? FLAG : '<span class="dot"></span>') + PEOPLE[who].right[t] + '/' + n + '<span class="pct">' + pc + '%</span><svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5l4 4 4-4"/></svg></span></button>' +
      '<div class="tsubs"' + (openRow === t ? "" : " hidden") + '>' + T.subs[t].map(function(s, j){ var y = PEOPLE[who].subs[t][j]; return '<span class="tsub' + (y ? "" : " x") + '"><b>' + (y ? TICK : CROSS) + '</b>' + esc(s) + '</span>'; }).join("") + '</div></div>';
  });
  h += '<div class="lists"><div><p class="mono">' + esc(T.goodAt) + '</p><ul>' + good.map(function(s){ return '<li>' + FLAG + esc(s) + '</li>'; }).join("") + '</ul></div>' +
       '<div><p class="mono">' + esc(T.workOn) + '</p>' + (work.length ? '<ul>' + work.map(function(s){ return '<li><span class="dot"></span>' + esc(s) + '</li>'; }).join("") + '</ul>' : '<ul></ul>') + '</div></div>';
  var old = $$(".bar i", $("#tboard")).map(function(i){ return i.style.width; });
  $("#tboard").innerHTML = h;
  var bars = $$(".bar i", $("#tboard"));
  if (old.length && !RM) { bars.forEach(function(b, i){ b.style.transition = "none"; b.style.width = old[i]; }); void document.body.offsetWidth; bars.forEach(function(b){ b.style.transition = ""; b.style.width = b.dataset.w + "%"; }); }
}
renderT(false);
$("#whoSwitch").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  who = +b.dataset.p; $$("#whoSwitch button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
  renderT(false);
});
$("#tboard").addEventListener("click", function(e){
  var b = e.target.closest(".tbtn"); if (!b) return;
  var t = +b.dataset.t; openRow = openRow === t ? -1 : t;
  $$(".tbtn", $("#tboard")).forEach(function(x){ var on = +x.dataset.t === openRow; x.setAttribute("aria-expanded", on); x.nextElementSibling.hidden = !on; });
});

/* ---------- certificate: the speedometer flips to the stitched certificate ---------- */
var K = C.cert;
gauge($("#certGauge"), 0, "c");
$("#certFace").innerHTML =
  '<defs><mask id="certM"><rect width="360" height="300" fill="#000"/><rect id="certSew" x="12" y="12" width="336" height="276" rx="3" fill="none" stroke="#fff" stroke-width="8" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></mask></defs>' +
  '<rect class="c-sew" x="12" y="12" width="336" height="276" rx="3" mask="url(#certM)"/>' +
  '<text class="c-kick" x="40" y="58">' + esc(K.kicker.toUpperCase()) + '</text>' +
  '<line x1="40" y1="72" x2="320" y2="72" stroke="var(--line2)" stroke-width="1"/>' +
  '<text class="c-test" x="40" y="112">' + esc(K.test.toUpperCase()) + '</text>' +
  '<text class="c-pass" x="38" y="172">' + esc(K.passed.toUpperCase()) + '</text>' +
  '<g transform="translate(270 130) scale(2.4)" style="color:var(--i)">' + FLAG.replace('class="flag" ', "") .replace("<svg", "<svg width=\"18\" height=\"14\"") + '</g>' +
  '<text class="c-meta" x="40" y="250">' + esc(K.name.toUpperCase()) + '</text>' +
  '<text class="c-meta" x="320" y="250" text-anchor="end">' + esc(K.date) + '</text>';
$("#stats").innerHTML = K.stats.map(function(s){ return '<div><p class="mono">' + esc(s.k) + '</p><b>' + esc(s.v) + (s.of ? '<small>' + esc(s.of) + '</small>' + esc(s.w) : "") + '</b></div>'; }).join("");
var card = $("#card3d"), sew = $("#certSew");
function sewIn(){
  if (RM) return;
  sew.style.transition = "none"; sew.style.strokeDashoffset = 100; void sew.getBoundingClientRect();
  setTimeout(function(){ sew.style.transition = "stroke-dashoffset 1.8s cubic-bezier(.22,.61,.36,1)"; sew.style.strokeDashoffset = 0; }, 700);
}
function turn(on){ card.classList.toggle("turned", on); if (on) sewIn(); }
$("#flip").addEventListener("click", function(){ turn(!card.classList.contains("turned")); });
if (RM) card.classList.add("turned");
else if ("IntersectionObserver" in window) {
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { io.disconnect(); setTimeout(function(){ turn(true); }, 1400); } }); }, { threshold: .6 });
  io.observe(card);
} else card.classList.add("turned");

/* ---------- the spreadsheet: three sheets ---------- */
var S = C.sheet, tab = 0;
$("#sheetTabs").innerHTML = S.tabs.map(function(t, i){ return '<button type="button" role="tab" aria-selected="' + (i === 0) + '" data-i="' + i + '">' + esc(t) + '</button>'; }).join("");
function renderS(){
  var h = "<table>";
  if (tab === 0) {
    h += "<tr><th></th>" + S.cols.map(function(c){ return "<th>" + esc(c) + "</th>"; }).join("") + "</tr>";
    S.rows.forEach(function(r, i){ h += '<tr><td class="rownum">' + (i + 2) + "</td>" + r.map(function(c, j){ return "<td" + (j === 3 ? ' class="wrap-c"' : j === 8 ? ' class="ans"' : "") + ">" + esc(c) + "</td>"; }).join("") + "</tr>"; });
  } else {
    var rows = tab === 1 ? S.settings : S.texts, hd = tab === 1 ? [S.settingCol, S.valueCol] : [S.keyCol, S.textCol];
    h += "<tr><th></th><th>" + esc(hd[0]) + "</th><th>" + esc(hd[1]) + "</th></tr>";
    rows.forEach(function(r, i){ h += '<tr><td class="rownum">' + (i + 2) + "</td><td" + (tab === 2 ? ' style="font-family:var(--mono);font-size:12.5px"' : "") + ">" + esc(r[0]) + '</td><td class="wrap-c">' + esc(r[1]) + "</td></tr>"; });
  }
  $("#sheetGrid").innerHTML = h + "</table>";
}
renderS();
$("#sheetTabs").addEventListener("click", function(e){
  var b = e.target.closest("button"); if (!b) return;
  tab = +b.dataset.i; $$("#sheetTabs button").forEach(function(x){ x.setAttribute("aria-selected", x === b); }); renderS();
});
})();
</script>
